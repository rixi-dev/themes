name: Validate Rice Submission

on:
  pull_request:
    branches: [main, test]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  validate:
    name: Validate Rice
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get changed files
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          cat changed_files.txt

      - name: Detect rice being submitted
        id: detect
        run: |
          # Extract first valid path like author/theme/...
          RICE=$(grep -E '^[^/]+/[^/]+' changed_files.txt | head -1 | cut -d'/' -f1,2)

          AUTHOR=$(echo "$RICE" | cut -d'/' -f1)
          THEME=$(echo "$RICE" | cut -d'/' -f2)

          if [ -z "$AUTHOR" ] || [ -z "$THEME" ]; then
            echo "::error::Could not detect author/theme from changed files."
            exit 1
          fi

          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          echo "theme=$THEME" >> $GITHUB_OUTPUT
          echo "rice_path=$AUTHOR/$THEME" >> $GITHUB_OUTPUT

          echo "Detected rice: $AUTHOR/$THEME"

      - name: Check directory structure
        id: structure
        run: |
          RICE_PATH="${{ steps.detect.outputs.rice_path }}"
          ERRORS=""

          [ ! -f "$RICE_PATH/manifest.toml" ] && ERRORS="$ERRORS\n- manifest.toml missing"
          [ ! -d "$RICE_PATH/configs" ] && ERRORS="$ERRORS\n- configs/ missing"
          [ ! -d "$RICE_PATH/walls" ] && ERRORS="$ERRORS\n- walls/ missing"
          [ ! -f "$RICE_PATH/preview.png" ] && ERRORS="$ERRORS\n- preview.png missing"

          if [ -d "$RICE_PATH/configs" ]; then
            COUNT=$(find "$RICE_PATH/configs" -mindepth 1 -maxdepth 1 -type d | wc -l)
            [ "$COUNT" -eq 0 ] && ERRORS="$ERRORS\n- configs/ is empty"
          fi

          if [ -n "$ERRORS" ]; then
            echo "errors<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ERRORS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "passed=false" >> $GITHUB_OUTPUT
          else
            echo "passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate manifest.toml
        id: manifest
        if: steps.structure.outputs.passed == 'true'
        run: |
          RICE_PATH="${{ steps.detect.outputs.rice_path }}"

          pip install tomli --quiet

          python3 << EOF
          import sys
          try:
              import tomli as tomllib
          except ImportError:
              import tomllib

          try:
              with open("$RICE_PATH/manifest.toml", "rb") as f:
                  manifest = tomllib.load(f)
          except Exception as e:
              print(f"TOML_ERROR:{e}")
              sys.exit(1)

          meta = manifest.get("meta", {})
          required = ["name", "author", "version", "wm", "display_server", "components", "description"]

          missing = [f for f in required if f not in meta]
          if missing:
              print("MISSING_FIELDS:" + ",".join(missing))
              sys.exit(1)

          if not isinstance(meta.get("components"), list) or not meta["components"]:
              print("EMPTY_COMPONENTS")
              sys.exit(1)

          print("OK")
          EOF

          if [ $? -ne 0 ]; then
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "errors=Invalid manifest.toml (missing fields or invalid format)" >> $GITHUB_OUTPUT
          else
            echo "passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Check for executables and binaries
        id: executables
        if: steps.manifest.outputs.passed == 'true'
        run: |
          RICE_PATH="${{ steps.detect.outputs.rice_path }}"
          ERRORS=""

          EXEC=$(find "$RICE_PATH" -type f -perm /111 ! -name "*.png" ! -name "*.jpg" ! -name "*.jpeg" ! -name "*.webp")
          [ -n "$EXEC" ] && ERRORS="$ERRORS\n- Executables found:\n$EXEC"

          BIN=$(find "$RICE_PATH" -type f | xargs file 2>/dev/null | grep -iE "binary|ELF" | cut -d: -f1)
          [ -n "$BIN" ] && ERRORS="$ERRORS\n- Binary files found:\n$BIN"

          if [ -n "$ERRORS" ]; then
            echo "errors<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ERRORS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "passed=false" >> $GITHUB_OUTPUT
          else
            echo "passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Scan for suspicious content
        id: security
        if: steps.executables.outputs.passed == 'true'
        run: |
          RICE_PATH="${{ steps.detect.outputs.rice_path }}"
          SUSPICIOUS=""

          PATTERNS=("curl " "wget " "bash -c" "sh -c" "eval " "base64 -d" "nc " "/dev/tcp" "mkfifo" "chmod +x" "sudo " "rm -rf")

          for P in "${PATTERNS[@]}"; do
            MATCH=$(grep -rn "$P" "$RICE_PATH/configs/" 2>/dev/null | head -5)
            [ -n "$MATCH" ] && SUSPICIOUS="$SUSPICIOUS\n- Pattern '$P':\n$MATCH"
          done

          if [ -n "$SUSPICIOUS" ]; then
            echo "suspicious<<EOF" >> $GITHUB_OUTPUT
            echo -e "$SUSPICIOUS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "passed=false" >> $GITHUB_OUTPUT
          else
            echo "passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate preview.png
        id: preview
        if: steps.security.outputs.passed == 'true'
        run: |
          FILE=$(file "${{ steps.detect.outputs.rice_path }}/preview.png" | grep -i "image")
          if [ -z "$FILE" ]; then
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "errors=Invalid preview.png" >> $GITHUB_OUTPUT
          else
            echo "passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Comment success on PR
        if: |
          steps.structure.outputs.passed == 'true' &&
          steps.manifest.outputs.passed == 'true' &&
          steps.executables.outputs.passed == 'true' &&
          steps.security.outputs.passed == 'true' &&
          steps.preview.outputs.passed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✓ Rice validation passed
                    **${{ steps.detect.outputs.author }}/${{ steps.detect.outputs.theme }}** is valid and ready for review.`
            });

      - name: Comment failure on PR
        if: |
          steps.structure.outputs.passed == 'false' ||
          steps.manifest.outputs.passed == 'false' ||
          steps.executables.outputs.passed == 'false' ||
          steps.security.outputs.passed == 'false' ||
          steps.preview.outputs.passed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            let errors = [];

            if ("${{ steps.structure.outputs.passed }}" === "false")
              errors.push("${{ steps.structure.outputs.errors }}");

            if ("${{ steps.manifest.outputs.passed }}" === "false")
              errors.push("${{ steps.manifest.outputs.errors }}");

            if ("${{ steps.executables.outputs.passed }}" === "false")
              errors.push("${{ steps.executables.outputs.errors }}");

            if ("${{ steps.security.outputs.passed }}" === "false")
              errors.push("${{ steps.security.outputs.suspicious }}");

            if ("${{ steps.preview.outputs.passed }}" === "false")
              errors.push("${{ steps.preview.outputs.errors }}");

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✗ Rice validation failed\n\n${errors.join("\n\n")}`
            });

      - name: Fail workflow
        if: |
          steps.structure.outputs.passed == 'false' ||
          steps.manifest.outputs.passed == 'false' ||
          steps.executables.outputs.passed == 'false' ||
          steps.security.outputs.passed == 'false' ||
          steps.preview.outputs.passed == 'false'
        run: exit 1
